# Grader config for the original side of Harbor parity, from the repository root:
#   cat <harbor>/datasets/frontier-finance-parity/*/tests/rubrics.jsonl > parity_rubrics.jsonl
#   frontier-finance-grader --config harbor_parity/eval.parity.yaml \
#       --responses runs/original1/system_summaries.json --output-dir runs/original1/grades
# Only the parity subset's rubrics, so the macro is over those queries, not all 220.
# Everything but the paths and judge_models is eval.example.yaml's.

rubrics_path: parity_rubrics.jsonl
responses_path: system_summaries.json
output_dir: grader_results/

# Parity judge panel, the same models and order as FF_JUDGE_MODELS on the Harbor side.
judge_models:
  - claude-haiku-5-5
  - gemini-3.8-flash
  - gpt-6-luna

max_rubrics_per_call: 30
concurrency: 8
max_tokens: 32000
request_timeout: 120.0
max_retries: 2
max_json_parse_retries: 1
